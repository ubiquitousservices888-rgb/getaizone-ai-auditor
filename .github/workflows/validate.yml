name: Validate GetAIZone

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Verify required files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s vercel.json
          test -s BUYER_HANDOFF.md
      - name: Verify core product hooks
        run: |
          grep -q 'auditForm' index.html
          grep -q 'scoreAudit' app.js
          grep -q 'Security risk' index.html
          grep -q 'Governance readiness' index.html
